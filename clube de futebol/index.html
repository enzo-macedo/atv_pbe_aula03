<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Clubes</title>
</head>

<body>

    <center>
        <h1>Novo Clube</h1>

        <form action="http://127.0.0.1:3000/" method="post">

            <input type="number" name="id" placeholder="ID" required>
            <br><br>

            <input type="text" name="nome" placeholder="Nome do clube" required>
            <br><br>

            <input type="number" name="vitorias" placeholder="Vitórias" required>
            <br><br>

            <input type="number" name="empates" placeholder="Empates" required>
            <br><br>

            <input type="number" name="derrotas" placeholder="Derrotas" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Cadastrar</button>

        </form>
    </center>

</body>

</html>
